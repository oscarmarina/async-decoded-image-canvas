<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>imageWithoutDecode</title>
    <style>
      html,
      body {
        margin: 0;
        font-family: sans-serif;
        background-color: #f8f9fa;
        color: #212529;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1rem;
      }

      a {
        color: #0d6efd;
      }

      p {
        text-align: center;
      }

      .mark {
        background-color: #fff;
        border: 1px solid #dee2e6;
        border-radius: 0.5rem;
        padding: 1.5rem;
        box-shadow: 0 1px 2px 0 rgb(0, 0, 0, 0.05);
        font-size: 0.9rem;
        line-height: 1.5;
        color: #6c757d;
      }

      div {
        display: flex;
        flex-direction: column;
        align-items: center;
        border-radius: 8px;
        overflow: hidden;
        background: #fff;
      }

      figure {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <p class="mark">
      Example compare with Blocking Decode (Native): <br />
      <a
        href="https://github.com/myshov/fastDrawImage/blob/main/examples/imageWithoutDecode.html"
        target="_blank"
        rel="noopener noreferrer"
        >https://github.com/myshov/fastDrawImage/blob/main/examples/imageWithoutDecode.html</a
      >
    </p>
    <div>
      <p>Native Image Async Decode (Non-Blocking)</p>
      <figure></figure>
    </div>
    <div>
      <p>Canvas Draw Sync Decode (Blocking)</p>
      <canvas id="canvas" width="800" height="600"></canvas>
    </div>
    <script>
      function loadImage() {
        const imageUrl =
          'https://upload.wikimedia.org/wikipedia/commons/2/21/%221ere_feuille_particuli%C3%A8re_du_Thibet%22_%28mention_ms%29_-_%28Anville%29_%3B_Deshulins_sculp._-_btv1b8491979b.jpg';
        const image = new Image();
        image.decoding = 'async';
        image.onload = () => {
          const canvas = document.getElementById('canvas');
          const ctx = canvas.getContext('2d');
          ctx.drawImage(image, 0, 0, 800, 600);
        };
        image.src = imageUrl;
        image.width = '800';
        image.height = '600';
        document.querySelector('figure').append(image);
      }
      loadImage();
    </script>
  </body>
</html>
